<!doctype html>
<meta charset="utf-8">
<title>Scoopies costing tests</title>
<pre id="result">RUNNING</pre>
<iframe id="app" src="../index.html?test=1" style="position:fixed;left:-10000px;top:0;width:1200px;height:900px;border:0"></iframe>
<script>
const output = document.getElementById('result');
const tests = [];
function test(name, run) { tests.push({ name, run }); }
function closeTo(actual, expected, epsilon = 1e-10) {
  if (!Number.isFinite(actual) || !Number.isFinite(expected)) {
    throw new Error(`expected finite ${expected}, received ${actual}`);
  }
  if (Math.abs(actual - expected) > epsilon) throw new Error(`expected ${expected}, received ${actual}`);
}
function assert(condition, message) {
  if (!condition) throw new Error(message || 'assertion failed');
}
document.getElementById('app').addEventListener('load', async () => {
  const app = document.getElementById('app').contentWindow;
  function normalizedState(overrides = {}) {
    const source = Object.assign({
      ingredientCategories: [], ingredients: [], packaging: [], recipes: [], products: []
    }, overrides);
    return app.normalizeState(source);
  }
  function installState(overrides = {}) {
    if (app.saveTimer) app.clearTimeout(app.saveTimer);
    app.state = normalizedState(overrides);
    app.cloud.connected = false;
    app.pendingSave = false;
    app.pendingRemote = null;
    app.saveTimer = null;
    app.localDirty = false;
    app.syncedState = app.snapshot(app.state);
    if (app.ingredientUi) {
      app.ingredientUi.search = '';
      app.ingredientUi.category = 'all';
    }
    const search = app.document.getElementById('ingredientSearch');
    if (search) search.value = '';
    app.renderAll();
    return app.state;
  }
  function click(element) {
    assert(element, 'expected clickable element was not rendered');
    element.dispatchEvent(new app.MouseEvent('click', { bubbles: true }));
  }
  function change(element, value) {
    assert(element, 'expected editable field was not rendered');
    element.value = value;
    element.dispatchEvent(new app.Event('change', { bubbles: true }));
  }
  function input(element, value) {
    assert(element, 'expected search field was not rendered');
    element.value = value;
    element.dispatchEvent(new app.Event('input', { bubbles: true }));
  }
  function storedState() {
    return JSON.parse(app.localStorage.getItem(app.KEY));
  }
  function rpcResult(data, error = null) {
    const payload = { data, error };
    const result = Promise.resolve(payload);
    result.single = () => Promise.resolve(payload);
    result.maybeSingle = () => Promise.resolve(payload);
    result.select = () => result;
    return result;
  }
  function installPublishableProduct(productOverrides = {}) {
    const state = installState({
      ingredients: [
        { id: 'matcha', name: 'Matcha', kind: 'purchased', purchaseQty: 1, amountPerItem: 1, unit: 'piece', price: 62.425 },
        { id: 'unused-ingredient', name: 'Unused ingredient', kind: 'purchased', purchaseQty: 1, amountPerItem: 1, unit: 'piece', price: 999 }
      ],
      packaging: [
        { id: 'cup', name: '12oz cup set', qty: 1, price: 15.545 },
        { id: 'unused-packaging', name: 'Unused packaging', qty: 1, price: 999 }
      ],
      recipes: [{
        id: 'matcha-recipe', name: 'Matcha Latte', yield: 1,
        lines: [{ id: 'matcha-line', ingredientId: 'matcha', qty: 1, unit: 'piece' }]
      }],
      products: [{
        id: 'matcha-product', name: 'Matcha Latte 12oz', recipeId: 'matcha-recipe',
        packLines: [{ id: 'cup-line', packagingId: 'cup', qty: 1 }],
        targetMargin: 53, price: '170.005'
      }]
    });
    Object.assign(state.products[0], productOverrides);
    return state.products[0];
  }
  function installPosContext(role = 'owner', publications = {}) {
    app.session = { user: { id: 'phase2-user', email: 'owner@example.test' } };
    app.currentUserId = 'phase2-user';
    app.cloud.connected = true;
    app.costingCloudReady = true;
    app.posContext = {
      loaded: true,
      loading: false,
      businessId: '11111111-1111-4111-8111-111111111111',
      businessName: 'Scoopies',
      role,
      categories: [],
      publications,
      error: ''
    };
    app.publishModalOpen = false;
    app.publishProductId = '';
    app.publishSnapshot = null;
    app.publishSubmitting = false;
    app.pendingRemote = null;
    const modal = app.document.getElementById('publishModal');
    if (modal) modal.hidden = true;
    if (typeof app.refreshModalBodyClass === 'function') app.refreshModalBodyClass();
    app.renderAll();
  }
  function publicationFixture(built, overrides = {}) {
    return Object.assign({
      source_costing_product_id: 'matcha-product',
      product_id: '22222222-2222-4222-8222-222222222222',
      active_version_id: '33333333-3333-4333-8333-333333333333',
      version_id: '33333333-3333-4333-8333-333333333333',
      version_number: 1,
      catalog_name: 'Matcha Latte 12oz',
      name_snapshot: 'Matcha Latte 12oz',
      size_snapshot: null,
      source_costing_recipe_id: 'matcha-recipe',
      selling_price_centavos: built.sellingPriceCentavos,
      ingredient_cost_centavos: built.ingredientCostCentavos,
      packaging_cost_centavos: built.packagingCostCentavos,
      costing_snapshot: built.snapshot,
      active_costing_snapshot: built.snapshot,
      source_costing_hash: 'phase2-fixture-hash',
      published_at: '2026-09-27T10:00:00.000Z',
      archived_at: null,
      publish_result: 'created'
    }, overrides);
  }
  function checkoutCatalogFixture(overrides = {}) {
    return Object.assign({
      product_id: '22222222-2222-4222-8222-222222222222',
      active_version_id: '33333333-3333-4333-8333-333333333333',
      category_id: '44444444-4444-4444-8444-444444444444',
      category_name: 'Matcha', product_name: 'Matcha Latte', size_snapshot: '12 oz',
      selling_price_centavos: 17000, product_sort_order: 0, category_sort_order: 0
    }, overrides);
  }
  function installCheckout(role = 'owner', catalog = [checkoutCatalogFixture()]) {
    app.localStorage.removeItem(app.POS_PENDING_KEY);
    app.resetPosCheckout();
    installPosContext(role);
    app.posCheckout.catalog = catalog;
    app.posCheckout.catalogLoading = false;
    app.posCheckout.catalogError = '';
    app.renderPos();
    return catalog;
  }
  function receiptFixture(overrides = {}) {
    return Object.assign({
      sale_id: '55555555-5555-4555-8555-555555555555', receipt_number: 'SCP-20260927-0001',
      business_date: '2026-09-27', completed_at: '2026-09-27T12:00:00.000Z', payment_method: 'cash',
      item_count: 1, units_sold: 1, subtotal_centavos: 17000, total_centavos: 17000,
      cash_tendered_centavos: 20000, change_given_centavos: 3000, is_retry: false
    }, overrides);
  }
  test('test mode isolates storage and disables every cloud connection', () => {
    if (!app.TEST_MODE || app.KEY !== 'scoopies_costing_test') throw new Error('test storage is not isolated');
    if (app.cloud.client || app.cloud.connected || app.session) throw new Error('cloud access is enabled in test mode');
  });
  test('three 330 ml cartons costing P324 produce the correct cost for 120 ml', () => {
    const ingredient = { id: 'vita-coconut-water', purchaseQty: 3, amountPerItem: 330, unit: 'ml', price: 324 };
    app.state.ingredients = [ingredient];
    closeTo(app.ingredientTotalBase(ingredient), 990);
    closeTo(app.ingCostPerBase(ingredient), 324 / 990);
    closeTo(app.lineCost({ ingredientId: ingredient.id, qty: 120, unit: 'ml' }), 39.27272727272727);
  });
  test('legacy ingredients keep treating qty as the total purchased amount', () => {
    const ingredient = { id: 'legacy-milk', qty: 1000, unit: 'ml', price: 108 };
    app.state.ingredients = [ingredient];
    closeTo(app.ingredientTotalBase(ingredient), 1000);
    closeTo(app.lineCost({ ingredientId: ingredient.id, qty: 120, unit: 'ml' }), 12.96);
  });
  test('editing one new field on a legacy ingredient keeps the other legacy default', () => {
    closeTo(app.ingredientTotalBase({ qty: 330, purchaseQty: 3, unit: 'ml' }), 990);
    closeTo(app.ingredientTotalBase({ qty: 330, amountPerItem: 500, unit: 'ml' }), 500);
  });

  test('liters and kilograms convert before package quantities are multiplied', () => {
    closeTo(app.ingredientTotalBase({ purchaseQty: 2, amountPerItem: 1.5, unit: 'l' }), 3000);
    closeTo(app.ingredientTotalBase({ purchaseQty: 3, amountPerItem: 0.5, unit: 'kg' }), 1500);
  });
  test('ingredient fields render clearly and changes are persisted in saved state', async () => {
    const ingredient = {
      id: 'rendered-vita', name: 'Vita Coconut Water', purchaseQty: 3,
      amountPerItem: 330, unit: 'ml', price: 324
    };
    app.state.ingredients = [ingredient];
    app.cloud.connected = false;
    app.renderIngredients();
    const row = app.document.querySelector('[data-entity="ingredient"]');
    const purchase = row.querySelector('[data-field="purchaseQty"]');
    const amount = row.querySelector('[data-field="amountPerItem"]');
    if (purchase.value !== '3' || amount.value !== '330') throw new Error('new fields did not render their saved values');
    amount.value = '500';
    amount.dispatchEvent(new app.Event('change', { bubbles: true }));
    const cached = JSON.parse(app.localStorage.getItem(app.KEY));
    if (cached.ingredients[0].amountPerItem !== '500') throw new Error('edited amount was not persisted by save()');
    let cloudPayload;
    app.cloud.client = {
      from(table) {
        if (table !== 'scoopies_state') throw new Error('wrong cloud table');
        return { upsert(payload, options) { cloudPayload = { payload, options }; return Promise.resolve({ error: null }); } };
      }
    };
    await app.cloudSave(app.state);
    if (cloudPayload.payload.id !== 'main' || cloudPayload.options.onConflict !== 'id') throw new Error('Supabase upsert contract changed');
    const savedIngredient = cloudPayload.payload.data.ingredients[0];
    if (savedIngredient.purchaseQty !== 3 || savedIngredient.amountPerItem !== '500') {
      throw new Error('new fields were missing from Supabase payload');
    }
  });
  test('selecting a recipe fills a blank product name', () => {
    app.state.recipes = [{ id: 'matcha', name: 'Coconut Matcha Cloud', yield: 1, lines: [] }];
    app.state.packaging = [];
    app.state.products = [{ id: 'drink', name: '', recipeId: '', packLines: [], targetMargin: 60, price: '' }];
    app.renderProducts();
    const recipe = app.document.querySelector('[data-entity="product"] [data-field="recipeId"]');
    recipe.value = 'matcha';
    recipe.dispatchEvent(new app.Event('change', { bubbles: true }));
    if (app.state.products[0].name !== 'Coconut Matcha Cloud') throw new Error('blank product name was not filled from recipe');
    const cached = JSON.parse(app.localStorage.getItem(app.KEY));
    if (cached.products[0].name !== 'Coconut Matcha Cloud') throw new Error('auto-filled product name was not saved');
  });
  test('changing recipes updates an automatically generated product name', () => {
    app.state.recipes = [
      { id: 'matcha', name: 'Coconut Matcha Cloud', yield: 1, lines: [] },
      { id: 'strawberry', name: 'Strawberry Matcha Cloud', yield: 1, lines: [] }
    ];
    app.state.packaging = [];
    app.state.products = [{ id: 'drink', name: 'Coconut Matcha Cloud', recipeId: 'matcha', packLines: [], targetMargin: 60, price: '' }];
    app.renderProducts();
    const recipe = app.document.querySelector('[data-entity="product"] [data-field="recipeId"]');
    recipe.value = 'strawberry';
    recipe.dispatchEvent(new app.Event('change', { bubbles: true }));
    if (app.state.products[0].name !== 'Strawberry Matcha Cloud') throw new Error('automatic product name did not follow recipe');
  });
  test('changing recipes preserves a customized product name', () => {
    app.state.recipes = [
      { id: 'matcha', name: 'Coconut Matcha Cloud', yield: 1, lines: [] },
      { id: 'strawberry', name: 'Strawberry Matcha Cloud', yield: 1, lines: [] }
    ];
    app.state.packaging = [];
    app.state.products = [{ id: 'drink', name: 'Coconut Matcha Cloud 22 oz', recipeId: 'matcha', packLines: [], targetMargin: 60, price: '' }];
    app.renderProducts();
    const recipe = app.document.querySelector('[data-entity="product"] [data-field="recipeId"]');
    recipe.value = 'strawberry';
    recipe.dispatchEvent(new app.Event('change', { bubbles: true }));
    if (app.state.products[0].name !== 'Coconut Matcha Cloud 22 oz') throw new Error('custom product name was overwritten');
  });
  test('clearing a recipe clears its automatically generated product name', () => {
    app.state.recipes = [{ id: 'matcha', name: 'Coconut Matcha Cloud', yield: 1, lines: [] }];
    app.state.packaging = [];
    app.state.products = [{ id: 'drink', name: 'Coconut Matcha Cloud', recipeId: 'matcha', packLines: [], targetMargin: 60, price: '' }];
    app.renderProducts();
    const recipe = app.document.querySelector('[data-entity="product"] [data-field="recipeId"]');
    recipe.value = '';
    recipe.dispatchEvent(new app.Event('change', { bubbles: true }));
    if (app.state.products[0].name !== '') throw new Error('automatic product name was not cleared with recipe');
  });
  test('clearing a recipe preserves a customized product name', () => {
    app.state.recipes = [{ id: 'matcha', name: 'Coconut Matcha Cloud', yield: 1, lines: [] }];
    app.state.packaging = [];
    app.state.products = [{ id: 'drink', name: 'Coconut Matcha Cloud 22 oz', recipeId: 'matcha', packLines: [], targetMargin: 60, price: '' }];
    app.renderProducts();
    const recipe = app.document.querySelector('[data-entity="product"] [data-field="recipeId"]');
    recipe.value = '';
    recipe.dispatchEvent(new app.Event('change', { bubbles: true }));
    if (app.state.products[0].name !== 'Coconut Matcha Cloud 22 oz') throw new Error('custom product name was cleared with recipe');
  });
  test('legacy state normalizes without changing existing ingredient costs', () => {
    const state = app.normalizeState({
      ingredients: [{ id: 'legacy-milk', name: 'Milk', qty: 1000, unit: 'ml', price: 108 }],
      packaging: [], recipes: [], products: []
    });
    assert(Array.isArray(state.ingredientCategories), 'legacy state did not gain ingredientCategories');
    assert(state.schemaVersion === 3 && Array.isArray(state.mixtureDrafts) && state.mixtureDrafts.length === 0, 'legacy state did not migrate to an empty draft collection');
    assert(state.ingredients[0].kind === 'purchased', 'legacy ingredient did not default to purchased');
    assert((state.ingredients[0].categoryId || '') === '', 'legacy ingredient should start uncategorized');
    app.state = state;
    closeTo(app.ingCostPerBase(state.ingredients[0]), 0.108);
    closeTo(app.lineCost({ ingredientId: 'legacy-milk', qty: 120, unit: 'ml' }), 12.96);
  });
  test('normalization preserves categories, mixture definitions, and unrelated app data', () => {
    const original = {
      ingredientCategories: [{ id: 'prepared', name: 'Prepared mixtures' }],
      ingredients: [
        { id: 'cream', name: 'Cream', kind: 'purchased', categoryId: '', purchaseQty: 1, amountPerItem: 1, unit: 'l', price: 500 },
        { id: 'whip', name: 'Sea Salt Whip', kind: 'mixture', categoryId: 'prepared', batchYield: 700, unit: 'ml', components: [{ ingredientId: 'cream', qty: 500, unit: 'ml' }] }
      ],
      packaging: [{ id: 'cup', name: 'Cup', qty: 50, price: 100 }],
      recipes: [{ id: 'latte', name: 'Matcha Latte', yield: 1, lines: [{ ingredientId: 'whip', qty: 40, unit: 'ml' }] }],
      products: [{ id: 'latte-product', name: 'Matcha Latte 12oz', recipeId: 'latte', packLines: [{ packagingId: 'cup', qty: 1 }], targetMargin: 53, price: 170 }]
    };
    const state = app.normalizeState(original);
    assert(state.ingredientCategories.length === 1 && state.ingredientCategories[0].name === 'Prepared mixtures', 'category was not preserved');
    assert(app.isMixture(state.ingredients[1]), 'mixture kind was not preserved');
    assert(state.ingredients[1].components.length === 1, 'mixture components were not preserved');
    assert(state.packaging.length === 1 && state.recipes.length === 1 && state.products.length === 1, 'normalization dropped existing business data');
  });
  test('prepared mixture computes exact batch cost and cost per output unit', () => {
    const state = installState({
      ingredients: [
        { id: 'cream', name: 'Whipping cream', kind: 'purchased', purchaseQty: 1, amountPerItem: 1, unit: 'l', price: 500 },
        { id: 'condensed', name: 'Condensed milk', kind: 'purchased', purchaseQty: 1, amountPerItem: 545, unit: 'ml', price: 88 },
        { id: 'salt', name: 'Sea salt', kind: 'purchased', purchaseQty: 1, amountPerItem: 225, unit: 'g', price: 99 },
        { id: 'whip', name: 'Sea Salt Whipped Cream', kind: 'mixture', batchYield: 700, unit: 'ml', components: [
          { ingredientId: 'cream', qty: 500, unit: 'ml' },
          { ingredientId: 'condensed', qty: 100, unit: 'ml' },
          { ingredientId: 'salt', qty: 2, unit: 'g' }
        ] }
      ]
    });
    const mixture = app.getById(state.ingredients, 'whip');
    const expectedBatchCost = 250 + (88 / 545 * 100) + (99 / 225 * 2);
    closeTo(app.mixtureBatchCost(mixture), expectedBatchCost);
    closeTo(app.ingredientTotalBase(mixture), 700);
    closeTo(app.ingCostPerBase(mixture), expectedBatchCost / 700);
  });
  test('mixture yields in liters and kilograms convert to base units', () => {
    let state = installState({ ingredients: [
      { id: 'liquid', name: 'Liquid input', kind: 'purchased', purchaseQty: 1, amountPerItem: 1, unit: 'l', price: 600 },
      { id: 'liquid-mix', name: 'Liquid mix', kind: 'mixture', batchYield: 1.5, unit: 'l', components: [{ ingredientId: 'liquid', qty: 1, unit: 'l' }] }
    ] });
    closeTo(app.ingredientTotalBase(app.getById(state.ingredients, 'liquid-mix')), 1500);
    closeTo(app.ingCostPerBase(app.getById(state.ingredients, 'liquid-mix')), 0.4);

    state = installState({ ingredients: [
      { id: 'powder', name: 'Powder', kind: 'purchased', purchaseQty: 1, amountPerItem: 2, unit: 'kg', price: 800 },
      { id: 'powder-mix', name: 'Powder mix', kind: 'mixture', batchYield: 0.5, unit: 'kg', components: [{ ingredientId: 'powder', qty: 250, unit: 'g' }] }
    ] });
    closeTo(app.ingredientTotalBase(app.getById(state.ingredients, 'powder-mix')), 500);
    closeTo(app.ingCostPerBase(app.getById(state.ingredients, 'powder-mix')), 0.2);
  });
  test('nested mixtures calculate from current component costs', () => {
    const state = installState({ ingredients: [
      { id: 'cream', name: 'Cream', kind: 'purchased', purchaseQty: 1, amountPerItem: 1, unit: 'l', price: 500 },
      { id: 'whip', name: 'Whip', kind: 'mixture', batchYield: 1000, unit: 'ml', components: [{ ingredientId: 'cream', qty: 800, unit: 'ml' }] },
      { id: 'salt-whip', name: 'Salt Whip', kind: 'mixture', batchYield: 250, unit: 'ml', components: [
        { ingredientId: 'whip', qty: 200, unit: 'ml' },
        { ingredientId: 'cream', qty: 50, unit: 'ml' }
      ] }
    ] });
    const whip = app.getById(state.ingredients, 'whip');
    const saltWhip = app.getById(state.ingredients, 'salt-whip');
    closeTo(app.mixtureBatchCost(whip), 400);
    closeTo(app.ingCostPerBase(whip), 0.4);
    closeTo(app.mixtureBatchCost(saltWhip), 105);
    closeTo(app.ingCostPerBase(saltWhip), 0.42);
  });
  test('supplier-price changes propagate through mixture, recipe, and product totals', () => {
    const state = installState({
      ingredients: [
        { id: 'cream', name: 'Cream', kind: 'purchased', purchaseQty: 1, amountPerItem: 1, unit: 'l', price: 500 },
        { id: 'whip', name: 'Whip', kind: 'mixture', batchYield: 1000, unit: 'ml', components: [{ ingredientId: 'cream', qty: 800, unit: 'ml' }] }
      ],
      packaging: [{ id: 'cup', name: 'Cup', qty: 50, price: 100 }],
      recipes: [{ id: 'latte', name: 'Latte', yield: 2, lines: [{ ingredientId: 'whip', qty: 100, unit: 'ml' }] }],
      products: [{ id: 'drink', name: 'Latte 12oz', recipeId: 'latte', packLines: [{ packagingId: 'cup', qty: 1 }], targetMargin: 50, price: 100 }]
    });
    const line = state.recipes[0].lines[0];
    closeTo(app.lineCost(line), 40);
    closeTo(app.recipeTotal(state.recipes[0]), 40);
    closeTo(app.recipePerServing(state.recipes[0]), 20);
    closeTo(app.productCost(state.products[0]), 22);

    app.getById(state.ingredients, 'cream').price = 600;
    closeTo(app.lineCost(line), 48);
    closeTo(app.recipePerServing(state.recipes[0]), 24);
    closeTo(app.productCost(state.products[0]), 26);
  });
  test('an incomplete purchased price invalidates every dependent cost', () => {
    const state = installState({
      ingredients: [{ id: 'milk', name: 'Milk', kind: 'purchased', purchaseQty: 1, amountPerItem: 1, unit: 'l', price: '' }],
      recipes: [{ id: 'latte', name: 'Latte', yield: 1, lines: [{ ingredientId: 'milk', qty: 120, unit: 'ml' }] }],
      products: [{ id: 'drink', name: 'Latte 12oz', recipeId: 'latte', packLines: [], targetMargin: 50, price: 100 }]
    });
    const ingredient = state.ingredients[0];
    assert(!app.ingredientCostInfo(ingredient).valid, 'blank supplier price was considered valid');
    assert(Number.isNaN(app.ingCostPerBase(ingredient)), 'blank supplier price was silently treated as zero per unit');
    assert(Number.isNaN(app.lineCost(state.recipes[0].lines[0])), 'recipe line hid an incomplete ingredient price');
    assert(Number.isNaN(app.recipeTotal(state.recipes[0])), 'recipe total hid an incomplete ingredient price');
    assert(Number.isNaN(app.productCost(state.products[0])), 'product total hid an incomplete ingredient price');
  });
  test('blank recipe quantity or yield cannot silently underprice a product', () => {
    const state = installState({
      ingredients: [{ id: 'milk', name: 'Milk', kind: 'purchased', purchaseQty: 1, amountPerItem: 1, unit: 'l', price: 120 }],
      recipes: [{ id: 'latte', name: 'Latte', yield: 1, lines: [{ ingredientId: 'milk', qty: '', unit: 'ml' }] }],
      products: [{ id: 'drink', name: 'Latte', recipeId: 'latte', packLines: [], targetMargin: 50, price: 100 }]
    });
    assert(Number.isNaN(app.lineCost(state.recipes[0].lines[0])), 'selected ingredient with blank quantity counted as zero');
    assert(Number.isNaN(app.productCost(state.products[0])), 'blank recipe quantity produced a product cost');
    state.recipes[0].lines[0].qty = 120;
    state.recipes[0].yield = 0;
    assert(Number.isNaN(app.recipePerServing(state.recipes[0])), 'zero recipe yield counted as zero cost per serving');
    assert(Number.isNaN(app.productCost(state.products[0])), 'zero recipe yield produced a product cost');
  });
  test('incomplete or missing packaging invalidates product pricing', () => {
    const state = installState({
      ingredients: [{ id: 'milk', name: 'Milk', kind: 'purchased', purchaseQty: 1, amountPerItem: 1, unit: 'l', price: 120 }],
      packaging: [{ id: 'cup', name: 'Cup', qty: '', price: 100 }],
      recipes: [{ id: 'latte', name: 'Latte', yield: 1, lines: [{ ingredientId: 'milk', qty: 120, unit: 'ml' }] }],
      products: [{ id: 'drink', name: 'Latte', recipeId: 'latte', packLines: [{ packagingId: 'cup', qty: 1 }], targetMargin: 50, price: 100 }]
    });
    assert(Number.isNaN(app.pkgCostPerPiece(state.packaging[0])), 'blank pack quantity counted as free packaging');
    assert(Number.isNaN(app.productCost(state.products[0])), 'incomplete packaging produced a product cost');
    state.packaging = [];
    assert(Number.isNaN(app.productCost(state.products[0])), 'missing referenced packaging counted as zero');
    state.products[0].recipeId = 'missing';
    assert(Number.isNaN(app.productCost(state.products[0])), 'missing referenced recipe counted as zero');
  });
  test('invalid circular mixture data is rejected without recursing forever', () => {

      app.clearTimeout = originalClearTimeout;

      app.cloud.connected = originalConnected;
      app.pendingSave = false;

    app.addPosProduct(catalog[0].product_id);app.posCheckout.cashReceived = '200';
    const sent = [];
    app.cloud.client = { rpc(name, args) {
      if (name === 'pos_complete_sale') { sent.push(app.snapshot(args)); return Promise.reject(new Error('Failed to fetch')); }
      return rpcResult([]);
    }};
    assert(!(await app.submitPosSale()), 'network-ambiguous sale reported success');
    assert(app.posCheckout.pending, 'network-ambiguous sale lost its pending request');
    const pendingId = app.posCheckout.pending.rpcArgs.p_client_sale_id;
    const records = app.posPendingRecords();
    assert(records[app.posPendingScope(app.session.user.id, app.posContext.businessId)], 'pending sale was not persisted under its account/workspace');
    app.cloud.client = { rpc(name, args) {
      if (name === 'pos_complete_sale') { sent.push(app.snapshot(args)); return rpcResult([receiptFixture({ is_retry: true })]); }
      return rpcResult([]);
    }};
    assert(await app.submitPosSale(), 'exact retry did not recover a receipt');
    assert(sent.length === 2 && sent[1].p_client_sale_id === pendingId, 'retry generated a different client sale UUID');
    assert(app.stableSerialize(sent[0]) === app.stableSerialize(sent[1]), 'retry changed the frozen request payload');
    assert(!app.posStoredPending(), 'confirmed retry left stale pending storage');
  });
  test('stale catalog rejection retains the cart until explicit price review', async () => {
    const oldCatalog = installCheckout('owner');
    app.addPosProduct(oldCatalog[0].product_id);app.posCheckout.cashReceived = '200';
    const updated = checkoutCatalogFixture({ active_version_id: '66666666-6666-4666-8666-666666666666', selling_price_centavos: 18000 });
    app.cloud.client = { rpc(name) {
      if (name === 'pos_complete_sale') return rpcResult(null, { code: '40001', message: 'catalog changed' });
      if (name === 'pos_get_catalog') return rpcResult([updated]);
      if (name === 'pos_get_today_summary' || name === 'pos_get_recent_sales') return rpcResult([]);
      throw new Error('unexpected RPC ' + name);
    }};
    assert(!(await app.submitPosSale()), 'stale cart unexpectedly completed');
    await new Promise(resolve => app.setTimeout(resolve, 0));
    const line = app.posCartLines()[0];
    assert(line && line.productVersionId === oldCatalog[0].active_version_id, 'stale rejection silently replaced the selected version');
    assert(line.stale && app.posCheckout.catalogChanged, 'stale line was not marked for review');
    assert(app.acceptPosCatalogChanges(), 'explicit catalog review could not be applied');
    assert(app.posCartLines()[0].productVersionId === updated.active_version_id && app.posCartLines()[0].priceCentavos === 18000, 'explicit review did not apply the new published price');
  });
  test('resolved Supabase errors become POS load errors instead of rejecting the loader', async () => {
    installCheckout('owner', []);
    app.cloud.client = { rpc() { return rpcResult(null, { message: 'service unavailable' }); } };
    const result = await app.loadPosCheckoutData();
    assert(result === false, 'failed POS loader reported success');
    assert(app.posCheckout.catalogError, 'resolved Supabase error was not shown as a catalog error');
    assert(!app.posCheckout.catalogLoading && !app.posCheckout.reportsLoading, 'failed loader remained stuck loading');
  });
  test('catalog refresh cannot invalidate an in-flight checkout response', async () => {
    const catalog = installCheckout('owner');
    app.addPosProduct(catalog[0].product_id);app.posCheckout.cashReceived = '200';
    let resolveCheckout, catalogCalls = 0;
    const response = new Promise(resolve => { resolveCheckout = resolve; });
    app.cloud.client = { rpc(name) {
      if (name === 'pos_complete_sale') return response;
      if (name === 'pos_get_catalog') catalogCalls++;
      return rpcResult([]);
    }};
    const submission = app.submitPosSale();
    assert(app.posCheckout.submitting, 'checkout did not lock immediately');
    assert((await app.loadPosCheckoutData()) === false && catalogCalls === 0, 'catalog reloaded during checkout');
    resolveCheckout({ data: [receiptFixture()], error: null });
    assert(await submission, 'valid in-flight receipt was discarded');
    assert(app.posCheckout.lastReceipt && !app.posCheckout.submitting, 'checkout remained stuck after receipt');
  });
  test('pending retries are isolated between accounts and workspaces', () => {
    installCheckout('owner');
    const userA = app.session.user.id, businessA = app.posContext.businessId;
    const makeRecord = (userId, businessId, saleId) => ({ schemaVersion: 1, userId, businessId, rpcArgs: { p_client_sale_id: saleId, p_payment_method: 'cash', p_cash_tendered_centavos: 20000 }, cartSnapshot: [{ productId: 'p', productVersionId: 'v', name: 'A', size: '', priceCentavos: 10000, quantity: 1 }] });
    const recordA = makeRecord(userA, businessA, 'aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa');
    app.posSavePending(recordA);
    app.posCheckout.pending = null;app.session = { user: { id: 'other-user' } };app.posContext.businessId = 'other-business';
    const recordB = makeRecord('other-user', 'other-business', 'bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb');app.posSavePending(recordB);
    assert(Object.keys(app.posPendingRecords()).length === 2, 'second account overwrote the first pending sale');
    app.resetPosCheckout();app.session = { user: { id: userA } };app.posContext.businessId = businessA;
    assert(app.posRestorePending() && app.posCheckout.pending.rpcArgs.p_client_sale_id === recordA.rpcArgs.p_client_sale_id, 'first account restored another account’s pending sale');
    app.localStorage.removeItem(app.POS_PENDING_KEY);app.resetPosCheckout();
  });
  test('fresh authentication opens POS but token refresh preserves manual navigation', async () => {
    await app.handleAuth(null);
    app.activateAppTab('ingredients', false);
    const originalCloudLoad = app.cloudLoad, originalCloudSave = app.cloudSave;
    app.cloudLoad = async () => app.snapshot(app.state);
    app.cloudSave = async () => {};
    app.cloud.client = {
      realtime: { setAuth() {} },
      channel() { return { on() { return this; }, subscribe() { return this; } }; },
      removeChannel() {},
      rpc(name) {
        if (name === 'pos_get_my_businesses') return rpcResult([{ business_id: '11111111-1111-4111-8111-111111111111', business_name: 'Scoopies', member_role: 'owner' }]);
        if (name === 'pos_get_publication_status' || name === 'pos_get_catalog' || name === 'pos_get_today_summary' || name === 'pos_get_recent_sales') return rpcResult([]);
        throw new Error('unexpected RPC ' + name);
      }
    };
    try {
      const login = { user: { id: 'fresh-pos-user', email: 'owner@example.test' }, access_token: 'test-token' };
      await app.handleAuth(login);
      assert(app.document.querySelector('section.active').id === 'pos', 'fresh login did not open POS');
      app.activateAppTab('ingredients', false);
      await app.handleAuth(login);
      assert(app.document.querySelector('section.active').id === 'ingredients', 'token refresh overrode manual navigation');
    } finally {
      app.cloudLoad = originalCloudLoad;app.cloudSave = originalCloudSave;
    }
  });
  const failures = [];
  for (const current of tests) {
    try { await current.run(); } catch (error) { failures.push(`${current.name}: ${error.message}`); }
  }
  output.textContent = failures.length ? `FAIL\n${failures.join('\n')}` : `PASS ${tests.length} tests`;
  document.title = failures.length ? 'FAIL' : 'PASS';
});
