function closeTo(actual, expected, epsilon = 1e-10) {
  if (!Number.isFinite(actual) || !Number.isFinite(expected)) {
    throw new Error(`expected finite ${expected}, received ${actual}`);
  }
  if (Math.abs(actual - expected) > epsilon) throw new Error(`expected ${expected}, received ${actual}`);
}

  if (!condition) throw new Error(message || 'assertion failed');

    assert(!!app.getById(app.state.packaging, 'local-cup') && !!app.getById(app.state.packaging, 'partner-lid'), 'ambiguous recovery lost a local or partner edit');
    assert(app.stockScopedSourceDeletes().length === 0, 'verified atomic deletion kept a stale recovery marker');

  test('failed atomic deletion keeps a remotely present source and clears its recovery marker', async () => {

        throw new Error('unexpected RPC ' + name);
      },
      from() { const query = { select() { return query; }, eq() { return query; }, maybeSingle() { return Promise.resolve({ data: { data: app.snapshot(remote) }, error: null }); } }; return query; }

    assert(app.stockScopedSourceDeletes().length === 0, 'confirmed non-commit kept an unnecessary recovery marker');

  test('unverifiable atomic deletion survives reload and completes from its exact recovery record', async () => {
    installInventory();
    const remote = app.snapshot(app.state), notices = [];

    let reads = 0;
    app.confirm = () => true; app.alert = message => notices.push(String(message));
    app.cloud.client = {
      rpc(name) {
        if (name === 'pos_inventory_validate_source_delete') return rpcResult([true]);
        if (name === 'pos_inventory_prepare_source_delete') return Promise.reject(new Error('response unavailable'));
        throw new Error('unexpected RPC ' + name);
      },
      from() { const query = { select() { return query; }, eq() { return query; }, maybeSingle() { reads += 1; return reads === 1 ? Promise.resolve({ data: { data: app.snapshot(remote) }, error: null }) : Promise.reject(new Error('verification offline')); } }; return query; }
    };
    try { assert(!(await app.deleteIngredientSafely('milk-source')), 'unverifiable deletion reported success'); }
    finally { app.confirm = oldConfirm; app.alert = oldAlert; }
    assert(app.stockScopedSourceDeletes().length === 1, 'unverifiable deletion did not retain its durable recovery record');
    remote.ingredients = remote.ingredients.filter(item => item.id !== 'milk-source');
    app.cloud.client = {
      rpc(name) { if (name === 'pos_inventory_prepare_source_delete') return rpcResult([true]); throw new Error('unexpected RPC ' + name); },
      from() { const query = { select() { return query; }, eq() { return query; }, maybeSingle() { return Promise.resolve({ data: { data: app.snapshot(remote) }, error: null }); } }; return query; }
    };
    assert((await app.stockRecoverSourceDeletes()) === 1, 'saved deletion recovery did not finish its exact atomic retry');
    assert(!app.getById(app.state.ingredients, 'milk-source') && app.stockScopedSourceDeletes().length === 0, 'recovered deletion did not adopt cloud state or clear its marker');
  });

  test('remote-missing deletion merges unrelated local and partner edits before any save', async () => {
    installInventory('owner', [], []);
    const remote = app.snapshot(app.syncedState), notices = [];
    remote.ingredients = remote.ingredients.filter(item => item.id !== 'milk-source');
    remote.packaging.push({ id: 'partner-lid', name: 'Partner lid', qty: 50, price: 75 });

        select() { return query; }, eq() { return query; },

  });
  const failures = [];
  for (let testIndex = 0; testIndex < tests.length; testIndex += 1) {
    const current = tests[testIndex];
    output.textContent = `RUNNING ${testIndex + 1}/${tests.length}: ${current.name}`;
    document.title = output.textContent;
    let timeoutId;
    try {
      await Promise.race([
        Promise.resolve().then(() => current.run()),
        new Promise((_, reject) => { timeoutId = window.setTimeout(() => reject(new Error('timed out after 5 seconds')), 5000); })
      ]);
    } catch (error) { failures.push(`${current.name}: ${error.message}`); }
    finally { if (timeoutId) window.clearTimeout(timeoutId); }
  }
  output.textContent = failures.length ? `FAIL\n${failures.join('\n')}` : `PASS ${tests.length} tests`;
  document.title = failures.length ? 'FAIL' : 'PASS';
});
